name: Bug report
description: Something in Nysera Desktop is broken or behaves unexpectedly
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste your OpenRouter API key** anywhere in this form.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - chat / bots
        - run lanes
        - settings & key
        - install / first launch
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text or screenshot
      description: Paste the error, or drag in a screenshot.
  - type: input
    id: version
    attributes:
      label: Version and system
      description: App version (bottom of the sidebar) and your OS (e.g. macOS 15 on Apple silicon, Windows 11)
    validations:
      required: true
